# Source Class Evaluation Benchmark Configuration
task: "source_class"
# Sampled equally per class (GALAXY, QUASAR) and per survey (e.g. 200 total with 2 classes and 2 surveys = 50 per cell).
total_samples: 200

surveys:
  - "sdss"
  - "desi"
# Oversampling factor when querying survey catalogs to account for blacklist drops
oversample_factor: 2.0
seed: 42
training_data: "data/crossmatch_cache/crossmatch_merged_1.0arcsec.parquet"
output: "data/benchmarks/source_class.parquet"
