[project]
name = "spectra-captioning"
version = "0.1.0"
description = "Generate spectra-aligned captions from astronomical paper mentions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "google-genai",
  "huggingface_hub[hf_transfer]",
  "ipykernel>=7.3.0",
  "jinja2",
  "lsdb",
  "python-dotenv",
  "pyyaml",
]

[project.scripts]
caption = "spectra_captioning.cli:run_captioning"
crossmatch = "spectra_captioning.cli:run_crossmatch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectra_captioning"]
