[project]
name = "spectra-captioning"
version = "0.1.0"
description = "Generate spectra-aligned captions from astronomical paper mentions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "astro-datalab>=2.24.0",
  "astropy>=8.0.1",
  "astroquery>=0.4.11",
  "fastspecfit>=3.6.1",
  "fitsio>=1.4.2",
  "google-genai",
  "huggingface_hub[hf_transfer]",
  "ipykernel>=7.3.0",
  "ipywidgets>=8.1.8",
  "jinja2",
  "lsdb",
  "matplotlib>=3.9.0",
  "pandas>=2.3.3",
  "pillow>=10.0.0",
  "pycurl>=7.47.0",
  "python-dotenv",
  "pyyaml",
  "requests>=2.34.2",
  "tqdm>=4.70.0",
]

[project.scripts]
caption = "spectra_captioning.cli:run_captioning"
crossmatch = "spectra_captioning.cli:run_crossmatch"
merge = "spectra_captioning.cli:run_merge"
extract = "spectra_captioning.cli:run_extract"
extract-type = "spectra_captioning.cli:run_extract_type"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectra_captioning"]
